        '401':
          $ref: '#/components/responses/Unauthorized'
  /client:
    post:
      tags:
        - client
      summary: Create New Client
      description: Create a new client.
      operationId: post-client
      requestBody:
        description: Post the necessary fields for the API to create a new client.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPost'
            example:
              description: Acme Corporation
              name: Acme Corp
              rsaPrivateKey: cnNhUHJpdmF0ZUtleQ==
              rsaPublicKey: cnNhUHVibGljS2V5
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Client created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    $ref: '#/components/schemas/Client'
                required:
                  - result
              example:
                data:
                  id: 1
                  name: Acme Corp
                  rsaPrivateKey: cnNhUHJpdmF0ZUtleQ==
                  rsaPublicKey: cnNhUHVibGljS2V5
                id: req-12345
