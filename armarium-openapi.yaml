                    example: []
                    items:
                      $ref: '#/components/schemas/Network'
                required:
                  - result
              example:
                data: []
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LocationNotFound'
    parameters:
      - $ref: '#/components/parameters/location_id'
  /location/{location_id}/rooms:
    get:
      tags:
