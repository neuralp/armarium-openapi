        - device
      summary: Get all devices
      description: Gets a list of all of the devices on the server.
      operationId: get-devices
      parameters:
        - name: page
          in: query
          description: The page of results to return based on the limit.
          schema:
            type: integer
        - name: limit
          in: query
          description: The number of entries to return in a single query.
          schema:
            type: integer
            default: 500
            maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  result:
                    type: string
                    enum:
                      - error
                      - success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                required:
                  - result
        '401':
          description: Unauthorized
  /device:
    post:
      tags:
        - device
      summary: Create New Device
      description: Create a new device.
      operationId: post-device
      requestBody:
        description: Post the necessary fields for the API to create a new device.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePost'
      responses:
        '200':
          description: Device Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  result:
                    type: string
                    enum:
                      - error
                      - success
                  data:
                    $ref: '#/components/schemas/Device'
                required:
                  - result
        '400':
          description: Required information missing.
        '401':
          description: Unauthorized
  /device/{device_id}:
    get:
      tags:
        - device
      summary: Get Device by Device ID
      description: Retrieve the information of the device with the matching device ID.
      operationId: get-device-deviceId
      responses:
        '200':
          description: Device Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  result:
                    type: string
                    enum:
                      - error
                      - success
                  data:
                    $ref: '#/components/schemas/Device'
                required:
                  - result
        '401':
          description: Unauthorized
        '404':
          description: Device Not Found
    patch:
      tags:
        - device
      summary: Update Device Information
      description: Update the information of an existing device.
      operationId: patch-device-deviceId
      requestBody:
        description: Patch device properties to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
        required: true
      responses:
        '200':
          description: Device Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  result:
                    type: string
                    enum:
                      - error
                      - success
                  data:
                    $ref: '#/components/schemas/Device'
        '401':
          description: Unauthorized
        '404':
          description: Device Not Found
    parameters:
      - $ref: '#/components/parameters/device_id'
    delete:
      operationId: delete-device-device-id
      summary: Delete device by Device ID
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
      tags:
        - device
  /application-configurations:
    get:
      summary: List Application Configurations
      operationId: listApplicationConfigurations
      responses:
