              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  client:
                    type: string
                    example: Acme Corp
                  data:
                    type: array
                    example: []
                    items:
                      $ref: '#/components/schemas/Location'
                  parents:
                    type: array
                    example: []
                    items:
                      $ref: '#/components/schemas/Location'
                required:
                  - result
              example:
                data: []
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Client location not found
    parameters:
      - $ref: '#/components/parameters/client_id'
  /locations:
    get:
      tags:
        - location
      summary: Get all locations
      description: Gets a list of all of the locations on the server.
      operationId: get-locations
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/search'
