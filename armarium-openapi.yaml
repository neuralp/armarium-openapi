    ClientNotFound:
      description: Client not found
    LocationNotFound:
      description: Location not found
    GroupNotFound:
      description: Group not found
    NetworkNotFound:
      description: Network not found
    RoomNotFound:
      description: Room not found
    DeviceNotFound:
      description: Device not found
    Accepted:
      description: Content accepted.
