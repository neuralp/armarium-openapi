      in: query
      description: The number of entries to return in a single query.
      schema:
        type: integer
        default: 500
        example: 50
        maximum: 1000
    search:
      name: search
      in: query
      description: Filter results by a free-text search term.
      schema:
        type: string
        maxLength: 64
