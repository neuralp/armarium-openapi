components:
  schemas:
    BaseModel:
      title: BaseModel
      description: Base model to be combined with all other models
      type: object
      properties:
        id:
          description: Autogenerated ID from the database.
          type: integer
          format: int64
          example: 1
          readOnly: true
        created:
          description: Datetime the model was created handled serverside.
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
        createdBy:
          description: Username the model was created by
          type: string
          example: jsmith
        updated:
          description: Datetime the model was updated handled server side.
          type: string
          format: date-time
          example: 2024-01-01T00:00:00Z
        updatedBy:
          description: Username the model was updated by
          type: string
          example: jsmith
    User:
      description: A user account on the system.
      example:
        accountLocked: false
        aesKey: YWVzS2V5QmFzZTY0
        emailVerified: false
        id: 1
        password: '********'
        systemAccount: false
        username: jsmith
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            username:
              type: string
              example: jsmith
              maxLength: 64
              pattern: ^[A-Za-z0-9_-]+
            password:
              type: string
              format: password
              example: '********'
              maxLength: 255
            aesKey:
              type: string
              format: byte
              example: YWVzS2V5QmFzZTY0
            rsaPublicKey:
              type: string
              format: byte
              example: cnNhUHVibGljS2V5
            rsaPrivateKey:
              type: string
              format: byte
              example: cnNhUHJpdmF0ZUtleQ==
            firstName:
              type: string
              example: John
              maxLength: 255
              pattern: ^[A-Za-z0-9 -]+
            lastName:
              type: string
              example: Smith
              maxLength: 255
              pattern: ^[A-Za-z0-9 -]+
            email:
              type: string
              format: email
              example: jsmith@example.com
              maxLength: 255
            emailVerified:
              type: boolean
              default: false
              example: false
            accountLocked:
              type: boolean
              default: true
              example: false
            systemAccount:
              type: boolean
              default: false
            groups:
              type: array
              example: []
              items:
                $ref: '#/components/schemas/Group'
            clients:
              type: array
              items:
                $ref: '#/components/schemas/Client'
            clientConfigurationData:
              type: object
              additionalProperties: true
          required:
            - username
            - password
            - aesKey
            - emailVerified
            - accountLocked
            - systemAccount
    UserPost:
      description: Request body for creating a new user.
      type: object
      properties:
        username:
          type: string
          example: jsmith
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+
        password:
          type: string
          format: password
          example: '********'
          maxLength: 255
        aesKey:
          type: string
          format: byte
          example: YWVzS2V5QmFzZTY0
        rsaPublicKey:
          type: string
          format: byte
          example: cnNhUHVibGljS2V5
        rsaPrivateKey:
          type: string
          format: byte
