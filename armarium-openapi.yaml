openapi: 3.1.0
info:
  title: armarium
  description: Interface to the Armarium Documentation Server API
  contact:
    name: Nicholas Pepper
  license:
    name: BSD
    identifier: BSD-2-Clause
  version: '1.0'
servers:
  - url: /api/v1
    description: Same origin server
paths:
  /token:
    post:
      tags:
        - authentication
      summary: ''
      description: Authorization endpoint for acquiring the JWT token
      operationId: post-token
      requestBody:
        description: User credentials for authentication.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                  maxLength: 255
                  pattern: ^[A-Za-z_-]+
                  example: jsmith
                password:
                  type: string
                  format: password
                  maxLength: 255
                  example: "********"
            example:
              username: jsmith
              password: "********"
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /refresh:
    post:
      tags:
        - authentication
      summary: Refresh session tokens
      description: Rotate the session using the refresh_token cookie. On success a fresh access_token and refresh_token cookie pair are set and the current user is returned. Returns 401 when the refresh token is missing, expired, or invalid.
      operationId: post-refresh
      responses:
        '200':
          description: Tokens refreshed
        '401':
          description: Missing, expired, or invalid refresh token
      security:
        - refresh_token: []
  /logoff:
    post:
      tags:
        - authentication
      summary: Log off the current session
      description: Terminate the current session. The access_token and refresh_token cookies are revoked and cleared. Returns 204 on success and 401 when no valid session is present.
      operationId: post-logoff
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - access_token: []
        - refresh_token: []
  /users:
    get:
      tags:
        - user
      summary: Get all users
      description: Gets a list of all of the users on the server.
      operationId: get-users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                    example: []
                required:
                  - result
              example:
                id: req-12345
                result: success
                data: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user:
    post:
      tags:
        - user
      summary: Create New User
      description: Create a new user.
      operationId: post-user
      requestBody:
        description: Post the necessary fields for the API to create a new user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPost'
            example:
              username: jsmith
              password: "********"
              aesKey: "YWVzS2V5QmFzZTY0"
              emailVerified: false
              accountLocked: true
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                    example:
                      id: 1
                      username: jsmith
                      password: "********"
                      aesKey: "YWVzS2V5QmFzZTY0"
                      emailVerified: false
                      accountLocked: false
              example:
                id: req-12345
                result: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Username already taken
  /user/{user_id}:
