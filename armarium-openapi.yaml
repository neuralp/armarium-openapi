      summary: List User Invites
      operationId: get-user-invites
      responses:
        '200':
          description: User invites retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    type: array
                    example: []
                    items:
                      $ref: '#/components/schemas/UserInvite'
                required:
                  - result
              example:
                data: []
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /user-invite:
    post:
      tags:
        - user
      summary: Create User Invite
      operationId: post-user-invite
      requestBody:
        description: Details of the user invite to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvitePost'
        required: true
      responses:
        '201':
          description: User invite created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    $ref: '#/components/schemas/UserInvite'
                required:
                  - result
              example:
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /user-invite/{invite_id}:
    get:
      tags:
        - user
      summary: Get User Invite
      operationId: get-user-invite-by-invite-id
      responses:
        '200':
          description: User invite retrieved successfully.
