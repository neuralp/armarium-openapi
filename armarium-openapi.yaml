          description: Locations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    type: array
                    example: []
                    items:
                      $ref: '#/components/schemas/Location'
                required:
                  - result
              example:
                data: []
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /location:
    post:
      tags:
        - location
      summary: Create New Location
      description: Create a new location.
      operationId: post-location
      requestBody:
        description: Post the necessary fields for the API to create a new location.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPost'
            example:
              address1: 123 Main St
              city: Springfield
              client: 1
              name: Main Office
              state: IL
              zip: '62701'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Location created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    $ref: '#/components/schemas/Location'
                required:
                  - result
              example:
                data:
                  id: 1
                  name: Main Office
                id: req-12345
                result: success
  /location/{location_id}:
