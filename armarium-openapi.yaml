      - $ref: '#/components/parameters/location_id'
  /location/{location_id}/upload:
    post:
      tags:
        - files
      summary: Upload location spreadsheet
      description: Upload a spreadsheet to import devices for the given location.
      operationId: post-location-by-location-id-upload
      requestBody:
        description: Multipart form containing the spreadsheet file and import configuration.
        content:
          multipart/form-data:
            schema:
              title: fileUpload
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - network_summary
                  example: network_summary
                file:
                  type: string
                  format: binary
                  example: (binary file content)
                headerRow:
                  type: integer
                  format: int32
                  example: 1
                columnMapping:
                  description: JSON-encoded object mapping each device field key to its spreadsheet column header, e.g. {"name":"Device Name"}. Kept as a string rather than a nested object so the multipart form field generates cleanly across clients.
                  type: string
                  example: '{"name":"Device Name"}'
              required:
                - file
                - type
            example:
              file: (binary file content)
              headerRow: 1
              type: network_summary
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    type: array
                    example: []
                    items:
                      $ref: '#/components/schemas/Device'
                required:
                  - result
                  - id
                  - data
              example:
                data: []
                id: req-12345
                result: success
    parameters:
      - $ref: '#/components/parameters/location_id'
  /parent/{parent_id}/locations:
    get:
      tags:
        - location
      summary: Get Locations by Parent Location ID
      description: Retrieve the locations that are sub-locations to the parent ID.
      operationId: get-locations-by-parent-id
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Sub-locations found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    type: array
                    example: []
