      operationId: delete-user-invite-by-invite-id
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/invite_id'
  /register/{registration_id}:
    post:
      tags:
        - user
      summary: Register User
      description: Complete a user registration using the token from a user invite.
      operationId: post-register-by-registration-id
      requestBody:
        description: The invite token and details of the user account to create.
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: 8f14e45fceea167a5a36dedd4bea2543
                user:
                  $ref: '#/components/schemas/UserPost'
              required:
                - token
      responses:
        '201':
          description: Registration successful
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
    parameters:
      - $ref: '#/components/parameters/registration_id'
  /clients:
    get:
      tags:
        - client
      summary: Get all clients
      description: Gets a list of all of the clients on the server.
      operationId: get-clients
      parameters:
