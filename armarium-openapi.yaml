openapi: 3.1.0
info:
  title: armarium
  description: Interface to the Armarium Documentation Server API
  contact:
    name: Nicholas Pepper
  license:
    name: BSD
    identifier: BSD-2-Clause
  version: '1.0'
servers:
  - url: /api/v1
    description: Same origin server
paths:
  /token:
    post:
      tags:
        - authentication
      summary: ''
      description: Authorization endpoint for acquiring the JWT token
      operationId: post-token
      requestBody:
        description: User credentials for authentication.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: jsmith
                  maxLength: 255
                  pattern: ^[A-Za-z_-]+
                password:
                  type: string
                  format: password
                  example: '********'
                  maxLength: 255
            example:
              password: '********'
              username: jsmith
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /refresh:
    post:
      tags:
        - authentication
      summary: Refresh session tokens
      description: Rotate the session using the refresh_token cookie. On success a fresh access_token and refresh_token cookie pair are set and the current user is returned. Returns 401 when the refresh token is missing, expired, or invalid.
      operationId: post-refresh
      responses:
        '200':
          description: Tokens refreshed
        '401':
          description: Missing, expired, or invalid refresh token
      security:
        - refresh_token: []
  /logoff:
    post:
      tags:
        - authentication
      summary: Log off the current session
      description: Terminate the current session. The access_token and refresh_token cookies are revoked and cleared. Returns 204 on success and 401 when no valid session is present.
      operationId: post-logoff
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
        - access_token: []
        - refresh_token: []
  /users:
    get:
      tags:
        - user
      summary: Get all users
      description: Gets a list of all of the users on the server.
      operationId: get-users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    type: array
                    example: []
                    items:
                      $ref: '#/components/schemas/User'
                required:
                  - result
              example:
                data: []
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user/{user_id}:
    get:
      tags:
        - user
      summary: Get User Info by User ID
      description: Retrieve the information of the user with the matching user ID.
      operationId: get-user-by-user-id
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    $ref: '#/components/schemas/User'
                required:
                  - result
              example:
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
    delete:
      tags:
        - user
      summary: Delete user by User ID
      operationId: delete-user-by-user-id
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - user
      summary: Update User Information
      description: Update the information of an existing user.
      operationId: patch-user-by-user-id
      requestBody:
        description: Patch user properties to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
            example:
              email: jsmith@example.com
              firstName: John
              lastName: Smith
        required: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: req-12345
                  result:
                    type: string
                    enum:
                      - error
                      - success
                    example: success
                  data:
                    $ref: '#/components/schemas/User'
              example:
                id: req-12345
                result: success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
    parameters:
      - $ref: '#/components/parameters/user_id'
  /me:
    get:
      tags:
        - user
      summary: Gets the current user
      operationId: get-me
      responses:
        '200':
          description: Current user retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags:
        - user
      summary: Update current user
      description: Update the profile of the currently authenticated user.
      operationId: patch-me
      requestBody:
        description: Patch current user properties to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
            example:
              email: jsmith@example.com
              firstName: John
              lastName: Smith
      responses:
        '200':
          description: Current user has been updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user-invites:
    get:
