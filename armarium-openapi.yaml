components:
  responses:
    OK:
      description: OK
    Created:
      description: Created
    NoContent:
      description: No Content
    BadRequest:
      description: Required information missing.
    Unauthorized:
      description: Unauthorized
    NotFound:
      description: Not Found
    UserNotFound:
      description: User not found
    ClientNotFound:
      description: Client not found
    LocationNotFound:
      description: Location not found
    GroupNotFound:
      description: Group not found
    NetworkNotFound:
      description: Network not found
    RoomNotFound:
      description: Room not found
    DeviceNotFound:
      description: Device not found
  schemas:
    BaseModel:
      title: BaseModel
      description: Base model to be combined with all other models
      type: object
      properties:
        id:
          description: Autogenerated ID from the database.
          type: integer
          format: int64
          readOnly: true
          example: 1
        created:
          description: Datetime the model was created handled serverside.
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        createdBy:
          description: Username the model was created by
          type: string
          example: jsmith
        updated:
          description: Datetime the model was updated handled server side.
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updatedBy:
          description: Username the model was updated by
          type: string
          example: jsmith
    User:
      description: A user account on the system.
      example:
        id: 1
        username: jsmith
        password: "********"
        aesKey: "YWVzS2V5QmFzZTY0"
        emailVerified: false
        accountLocked: false
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            username:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9_-]+
              example: jsmith
            password:
              type: string
              format: password
              maxLength: 255
              example: "********"
            aesKey:
              type: string
              format: byte
              example: "YWVzS2V5QmFzZTY0"
            rsaPublicKey:
              type: string
              format: byte
              example: "cnNhUHVibGljS2V5"
            rsaPrivateKey:
              type: string
              format: byte
              example: "cnNhUHJpdmF0ZUtleQ=="
            firstName:
              type: string
              maxLength: 255
              pattern: ^[A-Za-z0-9 -]+
              example: John
            lastName:
              type: string
              maxLength: 255
              pattern: ^[A-Za-z0-9 -]+
              example: Smith
            email:
              type: string
              format: email
              maxLength: 255
              example: jsmith@example.com
            emailVerified:
              type: boolean
              default: false
              example: false
            accountLocked:
              type: boolean
              default: true
              example: false
            groups:
              type: array
              items:
                $ref: '#/components/schemas/Group'
              example: []
          required:
            - username
            - password
            - aesKey
            - emailVerified
            - accountLocked
    UserPost:
      description: Request body for creating a new user.
      type: object
      properties:
        username:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+
          example: jsmith
        password:
          type: string
          format: password
          maxLength: 255
          example: "********"
        aesKey:
          type: string
          format: byte
          example: "YWVzS2V5QmFzZTY0"
        rsaPublicKey:
          type: string
          format: byte
          example: "cnNhUHVibGljS2V5"
        rsaPrivateKey:
          type: string
          format: byte
          example: "cnNhUHJpdmF0ZUtleQ=="
        firstName:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9 -]+
          example: John
        lastName:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9 -]+
          example: Smith
        email:
          type: string
          format: email
          maxLength: 255
          example: jsmith@example.com
        emailVerified:
          type: boolean
          default: false
          example: false
        accountLocked:
          type: boolean
          default: true
          example: false
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
          example: []
      required:
        - username
        - password
        - aesKey
        - emailVerified
        - accountLocked
    Group:
      description: A security group for organizing user permissions.
      example:
        id: 1
        name: Administrators
        description: System administrators group
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            name:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9 _.#-]+
              example: Administrators
            description:
              type: string
              maxLength: 255
              example: System administrators group
          required:
            - name
    GroupPost:
      description: Request body for creating a new group.
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9 _.#-]+
          example: Administrators
        description:
          type: string
          maxLength: 255
          example: System administrators group
      required:
        - name
    Client:
      description: An organizational client account.
      example:
        id: 1
        name: Acme Corp
        description: Acme Corporation client account
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            name:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9 _.#-]+
              example: Acme Corp
            description:
              type: string
              maxLength: 255
              example: Acme Corporation client account
          required:
            - name
    ClientPost:
      description: Request body for creating a new client.
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9 _.#-]+
          example: Acme Corp
        description:
          type: string
          maxLength: 255
          example: Acme Corporation client account
      required:
        - name
    Location:
      description: A physical location such as a building or site.
      example:
        id: 1
        name: Main Office
        city: Springfield
        state: IL
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            name:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9 _.#-]+
              example: Main Office
            description:
              type: string
              maxLength: 255
              example: Primary office location
            address1:
              type: string
              maxLength: 255
              pattern: ^[A-Za-z0-9 _.#-]+
              example: 123 Main St
            address2:
              type: string
              maxLength: 255
              pattern: ^[A-Za-z0-9 _.#-]+
              example: Suite 100
            city:
              type: string
              maxLength: 64
              pattern: ^[A-Za-z0-9-_.]+
              example: Springfield
            state:
              type: string
              maxLength: 2
              pattern: ^[A-Za-z ]+
              example: IL
            zip:
              type: string
              maxLength: 12
              pattern: ^[A-Za-z0-9-]+
              example: "62701"
            parent:
              description: The parent location, if this is a sub-location.
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                  example: 1
                name:
                  type: string
                  example: Main Office
            client:
              $ref: '#/components/schemas/Client'
          required:
            - name
    LocationPost:
      description: Request body for creating a new location.
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9 _.#-]+$
          example: Main Office
        description:
          type: string
          maxLength: 255
          example: Primary office location
        address1:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9 _.#-]+$
          example: 123 Main St
        address2:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9 _.#-]+$
          example: Suite 100
        city:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9-_.]+$
          example: Springfield
        state:
          type: string
          maxLength: 2
          pattern: ^[A-Za-z ]+$
          example: IL
        zip:
          type: string
          maxLength: 12
          pattern: ^[A-Za-z0-9-]+$
          example: "62701"
        parent:
          type: integer
          format: int64
          example: 1
        client:
          type: integer
          format: int64
          example: 1
      required:
        - name
    Room:
      description: A room within a location.
      example:
        id: 1
        name: Server Room A
        floor: 1
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            name:
              type: string
              maxLength: 64
              example: Server Room A
            number:
              type: string
              maxLength: 10
              example: "101"
            description:
              type: string
              maxLength: 255
              example: Primary server room
            floor:
              type: integer
              minimum: -10
              maximum: 255
              example: 1
            complete:
              type: boolean
              default: false
              example: false
            active:
              type: boolean
              default: true
              example: true
            location:
              $ref: '#/components/schemas/Location'
    RoomPost:
      description: Request body for creating a new room.
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          example: Server Room A
        number:
          type: string
          maxLength: 10
          example: "101"
        description:
          type: string
          maxLength: 255
          example: Primary server room
        floor:
          type: integer
          minimum: -10
          maximum: 255
          example: 1
        complete:
          type: boolean
          default: false
          example: false
        active:
          type: boolean
          default: true
          example: true
        location:
          type: integer
          format: int64
          example: 1
      required:
        - location
        - name
    Network:
      description: A network segment associated with a location.
      example:
        id: 1
        name: LAN
        base: 192.168.1.0
        mask: 255.255.255.0
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            name:
              type: string
              maxLength: 64
              example: LAN
            description:
              type: string
              maxLength: 255
              example: Local area network
            base:
              type: string
              format: ipv4
              example: 192.168.1.0
            mask:
              type: string
              format: ipv4
              example: 255.255.255.0
            dns1:
              type: string
              format: ipv4
              example: 8.8.8.8
            dns2:
              type: string
              format: ipv4
