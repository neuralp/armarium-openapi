    SearchResultData:
      description: Results from a successful search.
      type: object
      properties:
        type:
          description: The specific schema from the database that matched.
          type: string
          enum:
            - client
            - location
            - room
            - network
            - device
            - commission_project
        id:
          description: The ID of the matched row of data to be utilized along with the type to link to the specific item.
          type: integer
          format: int64
        name:
          type: string
        field:
          description: The field name of the database object that matched the trigram
          type: string
        matchedText:
          description: The field data that matched the trigram in the database.  Used for display purposes in the results.
          type: string
      required:
        - id
        - type
        - name
        - field
        - matchedText
