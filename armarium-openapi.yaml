      title: Application Configuration
      description: Stores the configuration data of the application in a key value store separated by namespaces.
      example:
        key: theme
        namespace: app
        value:
          color: blue
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            namespace:
              type: string
              example: app
              maxLength: 64
              pattern: ^[A-Za-z0-9_.-]+
            key:
              type: string
              example: theme
              maxLength: 64
              pattern: ^[A-Za-z0-9_.-]+
            value:
              example:
                color: blue
              additionalProperties: true
          required:
            - namespace
            - key
            - value
    CommissioningStep:
      description: A commission step is meant to be stored in a JSON blob per device and should not be assigned its own table in the database.
      type: object
      properties:
        step:
          type: integer
        action:
          type: string
        completed:
          type: boolean
        completedBy:
          type: string
        completedDate:
          type: string
          format: date-time
      required:
        - step
        - action
      additionalProperties: false
    GenericProduct:
      description: A generic product commissioning template defined by type and subtype.
      example:
        type: projector
        subtype: laser
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          properties:
            type:
              type: string
              maxLength: 64
            subtype:
              type: string
              maxLength: 64
            description:
              type: string
            steps:
              description: JSON blob of CommissioningStep records for this generic product.
              type: object
              items:
                $ref: '#/components/schemas/CommissioningStep'
          required:
            - subtype
            - type
